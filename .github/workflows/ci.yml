# Checks every push and pull request: types, tests, and that the demo builds.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      # .npmrc turns install scripts off.
      - name: Install
        run: npm ci

      # The components' tests run in a real Firefox (windows, popovers,
      # focus and keys as a browser does them).
      - name: Firefox for the tests
        run: npx playwright install --with-deps firefox

      - name: Types
        run: npm run check

      - name: Tests
        run: npm test

      - name: The demo builds
        run: npm run build
